{% extends 'base.html' %}
{% load static %}
{% block content %}

<!-- Header Section -->
<section class="section-hero overlay inner-page bg-image" style="background-image: url(/static/images/appli.jpg);">
  <div class="container">
    <div class="row">
      <div class="col-md-7">
        <h1 class="text-white font-weight-bold">Edit Company Profile</h1>
        <div class="custom-breadcrumbs">
          <a href="{% url 'jobapp:home' %}">Home</a>
          <span class="mx-2 slash">/</span>
          <span class="text-white"><strong>Edit Profile</strong></span>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Edit Form Section -->
<section class="site-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <h2 class="mb-4 text-center">Update Company Information</h2>
        {% include 'messages.html' %}
        
        <!-- Make sure the form action uses the EXACT name from urls.py -->
        <form method="POST" action="{% url 'account:edit-profile-employer' user.id %}" class="p-4 border rounded bg-white">
          {% csrf_token %}
          
          <!-- Form fields remain the same -->
          <div class="form-group">
            <label>Company Name</label>
            <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}" required>
          </div>
          
          <div class="form-group">
            <label>Company Address</label>
            <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}" required>
          </div>
          
          <div class="form-group">
            <label>Company Email</label>
            <input type="email" class="form-control" name="email" value="{{ user.email }}" required>
          </div>
          
          <div class="form-group text-center">
            <button type="submit" class="btn btn-primary px-5 py-2">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

<!-- Your existing styles -->
<style>
  .form-control {
    height: 45px;
    border-radius: 4px;
  }
  .btn-primary {
    background-color: #d6c101;
    border-color: #d6c101;
  }
  .btn-primary:hover {
    background-color: #d6c101;
    border-color: #d6c101;
  }
  .border.rounded {
    box-shadow: 0 0 15px rgba(0,0,0,0.05);
  }
  .site-section{
    margin-bottom: 2%;
  }
</style>
{% endblock %}
